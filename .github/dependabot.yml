# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This config complements the Daily Upgrade Scan routine
# (docs/automation/daily-upgrade-scan.md). Dependabot opens security
# advisories + version-update PRs; the routine triages and merges them.
# Without this file, only security alerts fire — version updates don't.

version: 2

updates:
  # ----------------------------------------------------------------------
  # Backend (Node.js / Express / Prisma)
  # ----------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "backend"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      backend-patch:
        update-types: ["patch"]
      backend-minor:
        update-types: ["minor"]
    ignore:
      # Major bumps are reviewed manually; the daily scan lists them on the
      # rolling "Deferred dependency upgrades" issue (#275), see
      # docs/automation/daily-upgrade-scan.md.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ----------------------------------------------------------------------
  # Mobile (React Native / Expo)
  # ----------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "mobile"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      mobile-patch:
        update-types: ["patch"]
      mobile-minor:
        update-types: ["minor"]
    ignore:
      # RN / Expo major bumps + Jest 30 are deferred; see
      # docs/automation/daily-upgrade-scan.md for the full deferral list.
      - dependency-name: "react-native"
      - dependency-name: "expo"
      - dependency-name: "jest"
        versions: [">=30"]
      # Expo-managed native modules: versions are pinned by the Expo SDK
      # (expo/bundledNativeModules.json), not by npm. Letting dependabot bump
      # these ahead of the current SDK breaks the native build (see #175, where
      # it proposed reanimated 4.4.1 / worklets 0.9.2 against the SDK 55 project
      # of the time, which pinned reanimated 4.2.1 / worklets 0.7.4). They move
      # only via an `expo install` / SDK upgrade. This enforces, at the dependabot level,
      # the RN-ecosystem deferral already documented as authoritative in
      # docs/automation/daily-upgrade-scan.md — re-evaluate at each SDK bump.
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "expo-application"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "expo-secure-store"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-worklets"
      # Packages with native code that the Expo SDK does NOT pin, plus the
      # react family (#562). An OTA ships JavaScript from the lockfile and runs
      # it against the native code frozen in the binary, so these move only
      # together with a native build and a new OTA runtime. The enforcement is
      # mobile/__tests__/binary-manifest.test.ts, which fails CI on any drift
      # from mobile/binary-manifest.json; these entries only stop Dependabot
      # from proposing bumps that can never pass. `expo-*` covers every Expo
      # module, including ones a future feature adds.
      - dependency-name: "@amplitude/analytics-react-native"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "expo-*"
      - dependency-name: "react-native-svg"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # react-test-renderer must equal the react version exactly.
      - dependency-name: "react-test-renderer"
      # lottie-react-native is pinned by the Expo SDK (SDK 57: ~7.3.8, see
      # expo/bundledNativeModules.json) and has native code, so it is already
      # held by the rules above; this entry is kept so the hold survives if the
      # SDK ever stops pinning it. The react-native >=0.84 requirement of
      # lottie >=7.4.0 that first motivated it (PR #314, #330) has been met
      # since the SDK 57 / RN 0.86 bump (#576); re-evaluate at each SDK bump.
      - dependency-name: "lottie-react-native"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ----------------------------------------------------------------------
  # Web (Next.js)
  # ----------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "web"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      web-patch:
        update-types: ["patch"]
      web-minor:
        update-types: ["minor"]
    ignore:
      # Major bumps are reviewed manually; the daily scan lists them on the
      # rolling "Deferred dependency upgrades" issue (#275).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ----------------------------------------------------------------------
  # GitHub Actions
  # ----------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
