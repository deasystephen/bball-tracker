name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Deploy main by hand (#570): Actions -> CI -> Run workflow, on main. The
  # whole suite runs first, then the deploy, whatever the path filter says.
  # This is how changes that reached main without a deploy (backend bumps that
  # Dependabot auto-merged) are shipped on purpose, at a chosen time.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        project: [backend, mobile]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Generate Prisma client
        if: matrix.project == 'backend'
        working-directory: ${{ matrix.project }}
        run: npx prisma generate

      - name: Run linter
        working-directory: ${{ matrix.project }}
        run: npm run lint

      - name: Type check
        working-directory: ${{ matrix.project }}
        run: npm run type-check

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bball_tracker_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bball_tracker_test
        run: npx prisma migrate deploy
      
      - name: Run tests (with coverage gate)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bball_tracker_test
          NODE_ENV: test
        run: npm test -- --coverage

  test-mobile:
    name: Test Mobile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run tests (with coverage gate)
        working-directory: mobile
        run: npm test -- --coverage

      - name: Verify Metro bundle resolves
        working-directory: mobile
        run: npx expo export --platform ios

  terraform-validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    # Static check only — no AWS credentials, no state, no plan. `terraform plan`
    # and `apply` stay manual (infra/README.md). Catches syntax, type and
    # reference errors in infra/*.tf before they can merge, since merging any
    # non-markdown file under infra/ also triggers a full ECS rollout.
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.5.7'

      - name: terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra
        run: terraform validate -no-color

  detect-changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          # Only non-markdown changes under these paths produce a new backend
          # container image. Mobile/web-only changes (e.g. nightly dep bumps) and
          # docs-only edits (e.g. a README under backend/ or infra/) must NOT
          # trigger an ECS deploy. `predicate-quantifier: every` makes a file
          # count only if it matches the path brace AND is not a .md file
          # (verified against picomatch, dorny's matcher — a plain `!**/*.md`
          # under the default `some` quantifier would NOT exclude). See #184/#188.
          predicate-quantifier: 'every'
          filters: |
            backend:
              - '{backend/**,infra/**,docker/**,.github/workflows/ci.yml}'
              - '!**/*.md'

      # A run started by hand always deploys: that is what it is for. The paths
      # above are repeated in .github/scripts/deploy-contents.sh, which lists
      # what a deploy carries; change them together.
      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${FILTER_BACKEND:-false}" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    name: Build & Deploy to ECS
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-backend, test-mobile, detect-changes]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.detect-changes.outputs.backend == 'true'
    # Serialize deploys to the shared ECS service. When the nightly upgrade scan
    # merges several PRs within minutes, concurrent deploy jobs would otherwise
    # race and the superseded one fails with a misleading "deployment not found /
    # circuit breaker" error. cancel-in-progress: false so an in-flight
    # production deploy always runs to completion rather than being cancelled
    # mid-rollout.
    concurrency:
      group: ecs-deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the summary below lists the commits since the one
          # production is running.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # A deploy ships everything on main since the running commit, not only
      # the change that started it (#570). The image tag is the commit it was
      # built from, so the image the service runs names the running commit.
      # This never blocks a deploy: the script always exits 0 and the step is
      # allowed to fail.
      - name: Summarize what this deploy carries
        continue-on-error: true
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER_NAME || 'bball-tracker-production-cluster' }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE_NAME || 'bball-tracker-production-api' }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          task_definition="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text || true)"
          image="$(aws ecs describe-task-definition --task-definition "$task_definition" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text || true)"
          .github/scripts/deploy-contents.sh "${image##*:}" "$GITHUB_SHA" "$PUSH_BEFORE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bball-tracker-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" -f docker/Dockerfile .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Inject SENTRY_RELEASE into task definition
        run: |
          sed -i "s/SENTRY_RELEASE_PLACEHOLDER/${{ github.sha }}/g" infra/task-definition.json

      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition.json
          container-name: api
          image: ${{ steps.build-image.outputs.image }}

      - name: Upload backend sourcemaps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        working-directory: backend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_BACKEND }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          npm ci
          npx prisma generate
          npm run build
          npx @sentry/cli releases new "$SENTRY_RELEASE"
          # Associate commits with this release so Sentry ingests commit messages
          # and can auto-resolve issues referenced by "Fixes <SENTRY-SHORT-ID>".
          # Requires the GitHub integration + repo linked in Sentry. --auto lets
          # Sentry compute the commit range via the integration; --ignore-missing
          # keeps a force-push/missing-commit edge case from failing the deploy.
          npx @sentry/cli releases set-commits "$SENTRY_RELEASE" --auto --ignore-missing
          npx @sentry/cli sourcemaps upload --release "$SENTRY_RELEASE" ./dist
          npx @sentry/cli releases finalize "$SENTRY_RELEASE"

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_NAME || 'bball-tracker-production-api' }}
          cluster: ${{ vars.ECS_CLUSTER_NAME || 'bball-tracker-production-cluster' }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      # /health returns the commit the answering task was built from (#570).
      # This reports and never fails the job: the step above has already judged
      # the deploy.
      - name: Read the commit production reports
        continue-on-error: true
        env:
          HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://api.hooplings.com/health' }}
        run: .github/scripts/report-deployed-commit.sh "$HEALTH_URL" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

