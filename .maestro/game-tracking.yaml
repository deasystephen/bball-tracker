appId: com.bballtracker.mobile
---
# Game Tracking: Create game with existing team → Start → Record stats → End
- launchApp:
    clearState: true
- tapOn: "Skip"
- tapOn: "Developer login with test users"
- assertVisible: "Select Test User"
- tapOn: "Frank Vogel.*"
- assertVisible: "Your Teams"

# Create a game with the Lakers
- tapOn: "Track game tab"
- tapOn: "Create new game"
- tapOn:
    id: "opponent-name-input"
- inputText: "Tracking Rival"
- tapOn: "Lakers.*"
- tapOn: "Create Game"

# Start the game
- assertVisible: "Tracking Rival"
- tapOn: "Start Game"

# On tracking screen, select a player from the roster
- assertVisible: "End game"
- tapOn: "LeBron James.*"

# Record a 2-point made shot
- tapOn: "2-point shot made"

# Player gets deselected after shot, re-select for next stat
- tapOn: "LeBron James.*"

# Record a made free throw — score goes 2 → 3 (+1, server-derived)
- tapOn: "free throw made"
- assertVisible: "Score: Lakers 3, Tracking Rival 0"

# Re-select player
- tapOn: "LeBron James.*"

# Record a rebound (label is "Off Reb")
- tapOn: "Record Off Reb"

# Re-select player
- tapOn: "LeBron James.*"

# Record an assist
- tapOn: "Record Assist"

# Go back to game detail to end from there
- tapOn: "Go back"
- tapOn: "Leave"

# End game from detail screen. Same fold issue as game-lifecycle.yaml: the
# button renders below Continue Tracking and sits off-screen on 874pt-class
# devices, so scroll it into view first (60% visibility per CLAUDE.md).
- assertVisible: "Continue Tracking"
- scrollUntilVisible:
    element:
      text: "End Game"
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
- tapOn: "End Game"
# Tap alert button (index 1 skips the on-screen button)
- tapOn:
    text: "End Game"
    index: 1

# Verify game is finished
- extendedWaitUntil:
    visible: "Game completed"
    timeout: 10000
