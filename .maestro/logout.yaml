appId: com.bballtracker.mobile
---
# Logout: Profile → Logout → Confirm → Verify login screen → Re-login
- launchApp:
    clearState: true
- tapOn: "Skip"
- tapOn: "Developer login with test users"
- assertVisible: "Select Test User"
- tapOn: "Frank Vogel.*"
- assertVisible: "Your Teams"

# Navigate to Profile tab
- tapOn: "Profile tab"
- assertVisible: "Account"

# Scroll to the end of the screen. One swipe can stop with the Logout row under
# the raised Track button of the tab bar: the row then counts as visible and
# the tap lands on the tab (seen on the SDK 58 build, #922). Two swipes reach
# the bottom, where the screen's tab bar padding keeps the row clear.
- swipe:
    start: 50%, 60%
    end: 50%, 20%
    duration: 500
- swipe:
    start: 50%, 60%
    end: 50%, 20%
    duration: 500

# Tap logout
- tapOn: "Logout"

# Confirm the logout alert
- tapOn:
    text: "Logout"
    index: 1

# Verify we're back on the login screen
- assertVisible: "Hooplings"

# Re-login to verify session was properly cleared
- tapOn: "Developer login with test users"
- assertVisible: "Select Test User"
- tapOn: "Frank Vogel.*"
- assertVisible: "Your Teams"
