appId: com.bballtracker.mobile
---
# Roster Management (unified Add Player, roster/invite unification spec):
# Navigate to team → Add Player (name only) → player visible immediately with
# a "Not invited" chip. The old two-button split (Create New Player /
# Add Roster Player) is gone — one form, email decides whether an invite goes.
- launchApp:
    clearState: true
- tapOn: "Skip"
- tapOn: "Developer login with test users"
# Wait for test user list to load
- extendedWaitUntil:
    visible: "Select Test User"
    timeout: 10000
- tapOn: "Frank Vogel.*"
- assertVisible: "Your Teams"

# Navigate to the Lakers team (wait for API load)
- tapOn: "Teams tab"
- assertVisible: "Teams"
- extendedWaitUntil:
    visible: "Lakers"
    timeout: 10000
- tapOn: "Lakers"

# Scroll down to see Add Player button
- scrollUntilVisible:
    element:
      text: "Add Player"
    direction: DOWN
    timeout: 10000

# Navigate to roster management
- tapOn: "Add Player"
- assertVisible: "Roster"
- assertVisible: "Invite Player"

# Open the unified Add Player form
- tapOn:
    id: "add-player-button"
- assertVisible: "Add Player"
# Under-13 steer (#982): the player-email field stays hidden until the coach
# answers the age question. Lakers has no age group, so nothing is preselected.
# The pills are SortPills; their accessibility label is "<question> <answer>".
- assertVisible: "Is this player 13 or older\\?"
- assertNotVisible:
    id: "add-player-email-input"
- tapOn: "Is this player 13 or older\\? Yes"
- assertVisible: "Player Email (optional)"
- assertVisible: "Parent/Guardian Email (optional)"

# Name-only add (case 1 — roster-only managed player, no invite)
- tapOn:
    id: "add-player-name-input"
- inputText: "E2E Test Player"
# Enter blurs the name field. The age question and the player-email field
# (#982) made the form taller, so with the name keyboard up the jersey field
# and submit sit under the keyboard and taps land on keys instead.
- pressKey: Enter
- tapOn:
    id: "add-player-jersey-input"
- inputText: "99"

# Dismiss the keyboard so the submit button is tappable. The jersey field has
# a NUMBER PAD, which has no return key, so Enter cannot blur it. The form's
# ScrollView has keyboardShouldPersistTaps="handled", so tapping any
# non-interactive text dismisses the keyboard deterministically. Tap the age
# question heading: since #982 the form is tall enough that the number pad
# covers the jersey field's own label, and a tap there lands on a key. Never
# hideKeyboard: on iOS it cannot hide a number pad, and since Maestro 2.11
# that fails the flow instead of doing nothing (#584).
- tapOn: "Is this player 13 or older\\?"

# Submit (below the fold since #982)
- scrollUntilVisible:
    element:
      id: "add-player-submit"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "add-player-submit"

# The player appears on the roster IMMEDIATELY with the "Not invited" chip
# (row-anchored label — a bare "Not invited" could match another row's chip)
# Scroll to the chip itself: a bare "E2E Test Player" also matches the name
# field when the add did not go through.
- scrollUntilVisible:
    element:
      text: "E2E Test Player status: Not invited"
    direction: DOWN
    timeout: 10000
- assertVisible: "E2E Test Player status: Not invited"

# Edit jersey & position from the row's overflow menu (jersey-loss follow-up:
# coaches can correct a number after the fact)
- tapOn: "Player options: E2E Test Player"
- tapOn: "Edit jersey & position"
- tapOn:
    id: "edit-member-jersey-input"
- eraseText
- inputText: "12"
- tapOn:
    id: "edit-member-position-input"
- inputText: "Guard"
# Enter blurs a single-line field. Not hideKeyboard: on iOS it cannot always
# hide the keyboard, and since Maestro 2.11 that fails the flow (#584).
- pressKey: Enter
- tapOn:
    id: "edit-member-save"

# The row subtitle re-renders with the new jersey and position
- assertVisible: "#12 • Guard"

# Under-13 branch (#982): answering No hides the player email and makes the
# parent/guardian email required. The seed reset deletes this flow-created
# managed player (removeFlowCreatedManagedPlayers), and its guardian invitation
# cascades with it.
- scrollUntilVisible:
    element:
      id: "add-player-button"
    direction: UP
    timeout: 10000
- tapOn:
    id: "add-player-button"
- tapOn: "Is this player 13 or older\\? Yes"
- tapOn:
    id: "add-player-email-input"
- inputText: "e2e-under13-kid@example.test"
- pressKey: Enter
# No clears the typed player email and removes the field
- tapOn: "Is this player 13 or older\\? No"
- assertNotVisible:
    id: "add-player-email-input"
- assertVisible: "Parent/Guardian Email"
- assertVisible: "Players under 13 don't get their own login.*"
- tapOn:
    id: "add-player-name-input"
- inputText: "E2E Under13 Player"
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "add-player-guardian-email-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "add-player-guardian-email-input"
- inputText: "e2e-under13-parent@example.test"
- pressKey: Enter
# The relationship chips appear once a guardian email is typed; the default
# (Guardian) is kept.
- scrollUntilVisible:
    element:
      id: "add-player-submit"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "add-player-submit"
- scrollUntilVisible:
    element:
      text: "E2E Under13 Player status: Not invited"
    direction: DOWN
    timeout: 10000
# No player email went out: the row is a roster-only managed player
- assertVisible: "E2E Under13 Player status: Not invited"
