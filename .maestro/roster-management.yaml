appId: com.bballtracker.mobile
---
# Roster Management (unified Add Player, roster/invite unification spec):
# Navigate to team → Add Player (name only) → player visible immediately with
# a "Not invited" chip. The old two-button split (Create New Player /
# Add Roster Player) is gone — one form, email decides whether an invite goes.
- launchApp:
    clearState: true
- tapOn: "Skip"
- tapOn: "Developer login with test users"
# Wait for test user list to load
- extendedWaitUntil:
    visible: "Select Test User"
    timeout: 10000
- tapOn: "Frank Vogel.*"
- assertVisible: "Your Teams"

# Navigate to the Lakers team (wait for API load)
- tapOn: "Teams tab"
- assertVisible: "Teams"
- extendedWaitUntil:
    visible: "Lakers"
    timeout: 10000
- tapOn: "Lakers"

# Scroll down to see Add Player button
- scrollUntilVisible:
    element:
      text: "Add Player"
    direction: DOWN
    timeout: 10000

# Navigate to roster management
- tapOn: "Add Player"
- assertVisible: "Roster"
- assertVisible: "Invite Player"

# Open the unified Add Player form
- tapOn:
    id: "add-player-button"
- assertVisible: "Add Player"
- assertVisible: "Player Email (optional)"
- assertVisible: "Parent/Guardian Email (optional)"

# Name-only add (case 1 — roster-only managed player, no invite)
- tapOn:
    id: "add-player-name-input"
- inputText: "E2E Test Player"
- tapOn:
    id: "add-player-jersey-input"
- inputText: "99"

# Dismiss the keyboard so the submit button is tappable. hideKeyboard is
# best-effort on iOS and silently fails against the jersey field's NUMBER PAD
# (no return key) — the submit tap then lands on the keyboard and the flow
# dies asserting a roster that never changed. The form's ScrollView has
# keyboardShouldPersistTaps="handled", so tapping any non-interactive text
# (the field's own label) dismisses the keyboard deterministically.
- hideKeyboard
- tapOn: "Jersey Number"

# Submit
- tapOn:
    id: "add-player-submit"

# The player appears on the roster IMMEDIATELY with the "Not invited" chip
# (row-anchored label — a bare "Not invited" could match another row's chip)
- scrollUntilVisible:
    element:
      text: "E2E Test Player"
    direction: DOWN
    timeout: 10000
- assertVisible: "E2E Test Player status: Not invited"

# Edit jersey & position from the row's overflow menu (jersey-loss follow-up:
# coaches can correct a number after the fact)
- tapOn: "Player options: E2E Test Player"
- tapOn: "Edit jersey & position"
- tapOn:
    id: "edit-member-jersey-input"
- eraseText
- inputText: "12"
- tapOn:
    id: "edit-member-position-input"
- inputText: "Guard"
- hideKeyboard
- tapOn:
    id: "edit-member-save"

# The row subtitle re-renders with the new jersey and position
- assertVisible: "#12 • Guard"
