appId: com.bballtracker.mobile
---
- launchApp:
    clearState: true
- tapOn: "Skip"
- tapOn: "Developer login with test users"
- assertVisible: "Select Test User"
- tapOn: "Frank Vogel.*"
- assertVisible: "Your Teams"
- tapOn: "Profile tab"
- assertVisible: "Account"
# No bare "Settings" assert here: the section header sits below the fold on
# 874pt-class devices and assertVisible needs it on-screen. The section is
# proven further down anyway (swipe → "Toggle dark mode" → About).
# Edit name round trip (Profile → Account → Name → shared name screen).
# Rename, assert it everywhere, then revert so other flows still find the
# seeded "Frank Vogel" (team-staff.yaml asserts that exact name).
- tapOn: "Edit name"
- assertVisible: "Edit your name"
- tapOn:
    id: "name-onboarding-input"
- eraseText
- inputText: "Frank Renamed"
# Save sits behind the keyboard: without dismissing it the tap lands on a
# keyboard key and appends a stray character to the name. hideKeyboard is
# unreliable on the iOS simulator (verified: keyboard still up afterwards);
# Enter is deterministic — the single-line input blurs on submit.
- pressKey: Enter
- tapOn: "Save"
- assertVisible: "Frank Renamed"
- tapOn: "Edit name"
- tapOn:
    id: "name-onboarding-input"
- eraseText
- inputText: "Frank Vogel"
- pressKey: Enter
- tapOn: "Save"
- assertVisible: "Frank Vogel"
- swipe:
    start: 50%, 60%
    end: 50%, 20%
    duration: 500
- assertVisible: "Toggle dark mode"
# About screen: version + OTA-update diagnostics (row shows "Version <x>").
- tapOn: "About"
- assertVisible: "App version"
- assertVisible: "Runtime version"
- assertVisible: "Channel"
- assertVisible: "Share diagnostics"
- tapOn: "Go back"
- assertVisible: "Toggle dark mode"
