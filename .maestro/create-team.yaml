appId: com.bballtracker.mobile
---
- launchApp:
    clearState: true
- tapOn: "Skip"
- tapOn: "Developer login with test users"
- assertVisible: "Select Test User"
- tapOn: "Frank Vogel.*"
- assertVisible: "Your Teams"
- tapOn: "Teams tab"
- assertVisible: "Teams"
- tapOn: "Create new team"
# inputText has no `id` key in Maestro — focus the field first, then type.
- tapOn:
    id: "team-name-input"
- inputText: "Test Team"
- hideKeyboard
# Frank Vogel belongs to a real league, so the screen offers the league/season
# pickers — but since #442 they sit behind a collapsed "League & season"
# disclosure whose default is "My teams" (create in the coach's own personal
# league, no picker needed). Expand it to exercise the real-league path.
# Tap by id: the disclosure carries an accessibilityLabel ("League and season:
# <summary>"), which Maestro matches instead of the inner text.
- tapOn:
    id: "league-season-disclosure"
# The Create button stays disabled until a season is picked for a real league
# (seeded: Downtown Youth Basketball League → Spring 2024).
- tapOn: "Downtown Youth Basketball League.*"
- tapOn: "Spring 2024.*"
# The expanded disclosure pushes the submit button further down than it used
# to be, so scroll it into view before tapping ("Create" full-matches the
# button; the header reads "Create Team").
- scrollUntilVisible:
    element:
      text: "Create"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "create-team-submit"
- assertVisible: "Test Team"
# Create screen is replaced (not pushed under) the detail screen, so back
# returns to the Teams list — never the spent create form. The success toast
# briefly covers the hero back arrow; since #464 toasts pass taps through, so
# this tap works no matter where it lands inside the toast's 3s lifetime.
- tapOn: "Go back"
- assertVisible: "Create new team"
- assertNotVisible:
    id: "team-name-input"
