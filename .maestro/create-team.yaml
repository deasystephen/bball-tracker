appId: com.bballtracker.mobile
---
- launchApp:
    clearState: true
- tapOn: "Skip"
- tapOn: "Developer login with test users"
- assertVisible: "Select Test User"
- tapOn: "Frank Vogel.*"
- assertVisible: "Your Teams"
- tapOn: "Teams tab"
- assertVisible: "Teams"
- tapOn: "Create new team"
# inputText has no `id` key in Maestro — focus the field first, then type.
- tapOn:
    id: "team-name-input"
- inputText: "Test Team"
# The Create button stays disabled until a league AND season are picked
# (seeded: Downtown Youth Basketball League → Spring 2024).
- tapOn: "Downtown Youth Basketball League.*"
- tapOn: "Spring 2024.*"
- hideKeyboard
- tapOn: "Create"
- assertVisible: "Test Team"
