appId: com.bballtracker.mobile
---
# !! RE-SEED BEFORE EVERY RUN:  cd backend && npx prisma db seed  !!
#
# `clearState: true` wipes AsyncStorage, NOT the database. This flow changes
# Dana's role to COACH and creates teams for her, so a second run without a
# re-seed skips the role step (needsRoleChoice is false for a non-PLAYER) and
# fails at the very first assertion. `npx prisma db seed` is the reset: it
# puts her back to PLAYER and deletes her teams and personal league.
#
# The role step is asserted HARD rather than wrapped in a conditional
# `runFlow`. A conditional would make the flow re-runnable, but it would also
# silently skip the first step of the journey #442 is measured by — and
# silently skipping is exactly how this flow shipped untested in the first
# place.
#
# !! THIS FLOW REQUIRES BOTH #442 AND #443 TO BE MERGED. !!
#
# It asserts the league/season disclosure is absent, which depends on
# `areAllLeaguesPersonal` being true. That reads `GET /leagues`, which #443
# scopes to the caller. Until #443 lands the list is global, a brand-new coach
# still sees the seeded "Downtown Youth Basketball League" (isPersonal: false),
# and the disclosure renders — so this flow FAILS on #442 alone. That is
# expected, not a regression.
#
# #442 alone still satisfies its acceptance criterion: the "My teams" default
# inside the disclosure carries the coach through to a created team with no
# admin intervention, and the "No leagues available" dead end is gone. What
# #443 adds is the coach never seeing the picker at all.
# Coach onboarding — the GA blocker #442 funnel, end to end.
#
# A brand-new coach with NO team, NO league and NO season must be able to
# create a team without ever meeting a league/season picker: the backend
# auto-provisions a personal league + season when `seasonId` is omitted.
# Dana Whitfield is the seeded fixture for exactly this (backend/prisma/seed.ts
# — no TeamStaff, no TeamMember, no LeagueAdmin row). Every other seeded coach
# is already rostered and admin@ is a league admin, so none of them can prove
# this path works.
#
# The flow creates TWO teams on purpose. The first exercises "no league exists
# yet" (provision), the second exercises "the personal league already exists"
# (reuse) — the branch the create screen must still render picker-free.
#
# Re-run `cd backend && npx prisma db seed` before re-running this flow: Dana
# is on the FREE tier (3-team cap) and the seed deletes the teams a previous
# run left behind.
- launchApp:
    clearState: true
- tapOn: "Skip"
- tapOn: "Developer login with test users"
- extendedWaitUntil:
    visible: "Select Test User"
    timeout: 10000
# The dev-user list is ordered by role (PLAYER, PARENT, COACH, ADMIN). Dana is
# seeded PLAYER (see seed.ts: every WorkOS sign-up starts as PLAYER, and #442's
# AC is that the coach PICKS Coach), so she sits among the players. Scrolling
# rather than assuming a position keeps this working if the fixture set grows.
# Match the email, not the name: it is unique in the list, it is its own Text
# node, and it cannot collide with a future fixture whose name also starts
# with "Dana". visibilityPercentage is relaxed from 100 so a card that is
# merely mostly on screen still counts.
- scrollUntilVisible:
    element:
      text: "dana.whitfield@example.com"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn: "dana.whitfield@example.com"

# Role step. The fixture is seeded PLAYER on purpose (every WorkOS sign-up is
# created as PLAYER), so this screen ALWAYS shows and picking Coach is a real
# step of the journey #442 is measured by — not an optional branch. Asserting
# it hard means a regression in role onboarding fails this flow instead of
# being silently skipped.
- assertVisible: "How will you use Capyhoops?"
- tapOn: "I coach a team"
- tapOn: "Continue"

# Home, for a coach with nothing yet. Deliberately NOT "Your Teams": that
# heading is gated on `teams.length > 0` (home.tsx), and having zero teams is
# the entire point of this fixture. The empty state is a stronger assertion
# anyway — "Create Team" only renders when `canCreateTeams(user)` is true, so
# it also proves the role switch to COACH actually took effect.
- extendedWaitUntil:
    visible: "No teams yet"
    timeout: 10000
- assertVisible: "Create Team"

# ---------------------------------------------------------------------------
# Team 1 — no personal league exists yet, the backend provisions one
# ---------------------------------------------------------------------------
- tapOn: "Teams tab"
- assertVisible: "Teams"
# Two different labels reach the same screen: the empty-state action
# ("Create New Team", `teams.createNew`) with no teams yet, and the grid card
# (accessibilityLabel "Create new team") once she has one. Match both.
- extendedWaitUntil:
    visible: "Create [Nn]ew [Tt]eam"
    timeout: 10000
- tapOn: "Create [Nn]ew [Tt]eam"
- assertVisible:
    id: "team-name-input"

# The whole point of #442: name-only form. No disclosure, no pickers, and
# above all not the old dead end.
- assertNotVisible:
    id: "league-season-disclosure"
- assertNotVisible: "No leagues available.*"

# inputText has no `id` key in Maestro — focus the field first, then type.
- tapOn:
    id: "team-name-input"
- inputText: "Fixture One"
- hideKeyboard
- tapOn:
    id: "create-team-submit"

# Lands on the team detail for the freshly provisioned team.
- extendedWaitUntil:
    visible: "Fixture One"
    timeout: 10000
- assertVisible: "Players"

# ---------------------------------------------------------------------------
# Add a player to the new team
# ---------------------------------------------------------------------------
# An empty roster renders "Add Player" twice (section button + empty card),
# so pin the first one.
- tapOn:
    text: "Add Player"
    index: 0
- assertVisible: "Roster"
- tapOn:
    id: "add-player-button"
- tapOn:
    id: "add-player-name-input"
- inputText: "Jordan Fixture"
- hideKeyboard
- tapOn:
    id: "add-player-submit"
# Rostered immediately (case 1, no email = no invite). The chip label is
# row-anchored — a bare "Not invited" could match a neighbouring row.
- extendedWaitUntil:
    visible: "Jordan Fixture status: Not invited"
    timeout: 10000

# Get back to the tabs by relaunching, NOT by navigating back.
#
# Neither the Roster screen nor team detail is inside the (tabs) navigator, so
# there is no tab bar to tap on either of them — both are pushed routes. And
# popping twice would land on team detail's back arrow, which is a no-op after
# `router.replace` (#464): the GA gate must not hang on a bug unrelated to the
# funnel it measures. Back-arrow behaviour is create-team.yaml's assertion.
#
# `launchApp` without clearState keeps the session (tokens live in SecureStore),
# so cold-start routing lands on Home with the tab bar present. It also
# incidentally proves the session survives a restart.
- launchApp
# Wait on the section heading, not a team name: cards use numberOfLines={1}
# (teams.tsx / home.tsx) and "Your Teams" only renders once she has a team, so
# it doubles as proof the first team persisted across the restart.
- extendedWaitUntil:
    visible: "Your Teams"
    timeout: 15000
- tapOn: "Teams tab"
- assertVisible: "Teams"

# ---------------------------------------------------------------------------
# Team 2 — the personal league now exists and must still be invisible
# ---------------------------------------------------------------------------
- extendedWaitUntil:
    visible: "Fixture One"
    timeout: 10000
- tapOn: "Create [Nn]ew [Tt]eam"
- assertVisible:
    id: "team-name-input"
# The reuse branch: one league exists now and it is hers, so the screen must
# still offer no league/season choice at all.
- assertNotVisible:
    id: "league-season-disclosure"
- assertNotVisible: "No leagues available.*"
- assertNotVisible: "Ask a league admin to create a season first.*"

- tapOn:
    id: "team-name-input"
- inputText: "Fixture Two"
- hideKeyboard
- tapOn:
    id: "create-team-submit"

- extendedWaitUntil:
    visible: "Fixture Two"
    timeout: 10000
- assertVisible: "Players"
