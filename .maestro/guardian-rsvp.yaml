appId: com.bballtracker.mobile
---
# Guardian RSVPs for their child (PARENT role — docs/plans/parent-role-spec.md,
# E2E plan I.5). Sonya Curry is the seeded guardian (MOTHER) of Steph Curry,
# who plays on the Warriors; the seed has a scheduled "Warriors vs Lakers"
# game. Sonya has no staff row anywhere, so she is a pure guardian: her Games
# tab lists only the Warriors games and no lifecycle/tracking controls render.
# (Dell Curry, Steph's FATHER, is deliberately NOT used here — the seed also
# makes him the Warriors' Team Manager, whose canTrackStats flag shows
# "Start Game" / "Continue Tracking".)
#
# Expected: Profile shows "My kids" with Steph; the Warriors game detail shows
# the "Responding for" picker (Sonya is not rostered, so only Steph is
# offered) and "Going" submits `POST /games/:id/rsvp { playerId: <steph> }`.
- launchApp:
    clearState: true
- tapOn: "Skip"
- tapOn: "Developer login with test users"
- assertVisible: "Select Test User"
- tapOn: "Sonya Curry.*"

# Profile → My kids
- tapOn: "Profile tab"
- assertVisible: "My kids"
- assertVisible: "Steph Curry, Mother"
- assertNotVisible: "Change account type"

# Open the child's scheduled game. The game card is ONE element whose
# accessibility label concatenates its fields ("FEB 8, vs Lakers, Warriors"),
# so a bare full-match "vs Lakers" matches nothing — composite-row rule from
# CLAUDE.md. Only this card contains "vs Lakers", so the wildcard is safe.
- tapOn: "Track game tab"
- assertVisible: "Games"
- tapOn: ".*vs Lakers.*"
- assertVisible: "Scheduled"

# RSVP for the child — guardians get no lifecycle / tracking controls
- assertVisible: "Responding for"
- assertVisible: "Respond for Steph Curry"
- assertNotVisible: "Start Game"
- assertNotVisible: "Continue Tracking"
- tapOn: "Going"
- assertVisible: ".*going.*"
